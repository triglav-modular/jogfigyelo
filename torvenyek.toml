# Alap törvénycsomag: the statutes the watcher follows in the Magyar Közlöny.
#
# When a gazette act amends one of these, it is reported. How loudly comes
# from the weight of the section it changes where one is set below, and from
# the statute's own weight otherwise. From `strong_weight` up the dashboard
# shows it as a strong alert.
#
# Weights are placeholders until they are calibrated against earlier
# amending acts: 10 is core worker protection (a notice period), 1 is
# housekeeping. Sections are keyed as the gazette numbers them: "69", "69/A".
#
# `name` is matched as it stands before "szóló" in the gazette's own
# citation ("a munka törvénykönyvéről szóló 2012. évi I. törvény"), so a
# decree can be followed the same way. `number` is for people: it is not
# matched. Abbreviations an act defines for itself ("a továbbiakban: Mt.")
# are picked up from the act, `short` as well.
#
# Test against a downloaded issue:  python3 jogfigyelo.py --pdf MK_26_138.pdf

strong_weight = 8

[[statute]]
short = "Mt."
name = "munka törvénykönyvéről"
number = "2012. évi I. törvény"
weight = 5
[statute.sections]
"69" = 10   # felmondási idő
"102" = 2   # munkaszüneti napok

