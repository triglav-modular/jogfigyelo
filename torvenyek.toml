# Acts that matter for what they are rather than for a statute they amend,
# recognised by their title: the yearly decree on which days are worked
# ("a 2027. évi munkaszüneti napok körüli munkarendről") and its amendments,
# the minimum-wage decree. Weights as above.
[[topic]]
note = "munkaszüneti napok, munkanap-áthelyezés"
re = 'munkaszüneti nap|munkanap-?áthelyez|körüli munkarend'
weight = 9

[[topic]]
